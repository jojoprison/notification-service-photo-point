version: "3.9"
services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./:/app
  worker:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    command: bash -lc "celery -A app worker -l info"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/app
  beat:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    command: bash -lc "celery -A app beat -l info"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./:/app
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  pgdata:
